name: Deploy Maelstrom Matrix Visualizer

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: mordor
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        run: |
          apk add --no-cache curl bash
          curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://maelstrom.nealwang.dev/
          server: maelstrom.nealwang.dev
          token: ${{ forgejo.token }}
          source: visualizer/dist/
