name: Deploy visualiser and docs

on:
  push:
    branches:
      - main

concurrency:
  group: maelstrom-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: mordor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache curl bash typst
          curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build visualiser
        working-directory: visualizer
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build docs
        run: |
          uv sync --frozen --no-dev --group docs
          uv run --no-sync --group docs mkdocs build --strict --site-dir visualizer/dist/docs

      - name: Deploy to Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://maelstrom.nealwang.dev/
          server: maelstrom.nealwang.dev
          token: ${{ forgejo.token }}
          source: visualizer/dist/
