name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - ".forgejo/workflows/deploy-docs.yaml"
      - "docs/**"
      - "mkdocs.yaml"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: maelstrom-docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: mordor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install docs dependencies
        run: uv sync --frozen --no-dev --group docs

      - name: Install Typst
        run: apk add --no-cache typst

      - name: Build docs
        run: uv run --no-sync --group docs mkdocs build --strict

      - name: Deploy to Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://docs.maelstrom.nealwang.dev/
          server: docs.maelstrom.nealwang.dev
          token: ${{ forgejo.token }}
          source: site/
